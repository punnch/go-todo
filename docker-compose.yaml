services:
  application:
    build: .
    container_name: go-todo
    environment:
      DB_URL: ${DB_URL}
    ports:
      - 8080:8080

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    # healthcheck:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./out/pg_data:/var/lib/postgresql 
    ports:
      - 5432:5432

  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      - postgres
          # condition: service_helthy
    volumes:
      - ./migrations:/app/migrations
    command: 
      -path /app/migrations -database ${DB_URL} up
