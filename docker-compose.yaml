services:
  application:
    build: .
    container_name: go-todo
    environment:
      DB_URL: ${DB_URL}
    ports:
      - 8080:8080

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_URL}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./out/pg_data:/var/lib/postgresql 
    ports:
      - 5432:5432

  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    command: 
      -path /app/migrations -database ${DB_URL} up
