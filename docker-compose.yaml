services:
  api-service:
    build:
      context: .
      dockerfile: cmd/api-service/Dockerfile
    container_name: api-service
    depends_on:
      - db-service
    environment:
      DB_SERVICE_URL: ${DB_SERVICE_URL}
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - 8080:8080

  db-service:
    build:
      context: .
      dockerfile: cmd/db-service/Dockerfile
    container_name: db-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      DB_SERVICE_PORT: ${DB_SERVICE_PORT}
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - 8010:8010

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_URL}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./out/pg_data:/var/lib/postgresql
    ports:
      - 5432:5432

  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      - postgres
    volumes:
      - ./internal/services/db-service/migrations:/migrations
    command: -path /migrations -database ${DB_URL} up
