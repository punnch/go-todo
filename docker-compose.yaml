services:
  api-service:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: cmd/api-service/Dockerfile
    container_name: api-service
    restart: always
    depends_on:
      - db-service
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_SERVICE_PORT=${DB_SERVICE_PORT}
      - API_SERVICE_PORT=${API_SERVICE_PORT}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - ${API_SERVICE_PORT}:${API_SERVICE_PORT}

  db-service:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: cmd/db-service/Dockerfile
    container_name: db-service
    restart: always
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_SERVICE_PORT=${DB_SERVICE_PORT}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - ${DB_SERVICE_PORT}:${DB_SERVICE_PORT}

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: postgres-port-forwarder
    command: "tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432"
    ports:
      - "127.0.0.1:5432:5432"

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: postgres-migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
